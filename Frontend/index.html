<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var stored = localStorage.getItem('hrms-theme');
        var isDark = stored !== 'light';
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
    <link rel="icon" type="image/png" href="/HRMS%20Logo.png" />
    <!-- No browser pinch/double-tap zoom: the app is installed as a PWA and
         should behave like a native app. user-scalable=no covers Android;
         iOS ignores it, so index.css (touch-action) and main.tsx
         (gesturestart) cover iPhone. viewport-fit=cover makes
         env(safe-area-inset-*) work (BottomNav vs the home indicator).
         Document previews get their own zoom (ZoomableImage.tsx). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Prizm HR</title>
    <!-- Startup loader, visible before any JS/CSS has downloaded (slow
         network, first open). Plain inline CSS since Tailwind isn't loaded
         yet; React replaces #root's contents on its first render. Matches
         components/ui/FullScreenLoader.tsx so the hand-over looks seamless. -->
    <style>
      .boot-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #f7f9fc; color: #5a6b85; font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 0 16px; }
      html.dark .boot-loader { background: #000000; color: #9ca3af; }
      .boot-loader__spinner { width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; border: 4px solid rgba(51, 84, 164, 0.2); border-top-color: #3354a4; animation: boot-spin 0.9s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader">
        <div class="boot-loader__spinner"></div>
        <div>Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
